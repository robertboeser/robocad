name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: ./scripts/package-macos.sh --universal
            artifact: dist/*.dmg
          - os: ubuntu-latest
            script: ./scripts/package-linux.sh
            artifact: dist/*.tar.gz
          - os: windows-latest
            script: pwsh ./scripts/package-windows.ps1
            artifact: dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev cmake
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release
      - name: Package
        run: ${{ matrix.script }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: robocad-${{ matrix.os }}
          path: ${{ matrix.artifact }}
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
