[package]
name = "rc-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "robocad desktop application"

[lib]
path = "src/lib.rs"

[[bin]]
name = "robocad"
path = "src/main.rs"

[dependencies]
rc-mesh.workspace = true
rc-render.workspace = true
rc-doc.workspace = true
rc-kernel.workspace = true
glam.workspace = true
rayon.workspace = true
log.workspace = true
env_logger.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11", "persistence"] }
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
directories.workspace = true

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
tempfile.workspace = true
