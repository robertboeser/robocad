[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robertboeser/robocad"
rust-version = "1.90"

[workspace.dependencies]
rc-mesh = { path = "crates/rc-mesh" }
rc-kernel = { path = "crates/rc-kernel" }
rc-doc = { path = "crates/rc-doc" }
rc-render = { path = "crates/rc-render" }

glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
fast-float2 = "0.2"
rayon = "1.12"
slotmap = { version = "1.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }

# dev
proptest = "1.12"
criterion = "0.8"
tempfile = "3"
assert_cmd = "2.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
float_cmp = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
debug = true
strip = false
